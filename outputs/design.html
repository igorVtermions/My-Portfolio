 lançamento.</p><p>Na Mágicos da Limpeza, colaboro na construção de aplicações para uma empresa em Portugal. Também desenvolvo o Escoply, meu SaaS para organizar a rotina de freelancers, atualmente em construção e testes com usuários convidados.</p><button class=\"textlink\" onclick=\"parent.show('historia')\">Minha trajetória completa <svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#arrow-right\"/></svg></button></div></section><section id=\"stack\" class=\"stacksection\" tabindex=\"-1\"><div class=\"sectionhead\"><div><span class=\"eyebrow\">03 / MINHA STACK</span><h2>As ferramentas<br>por trás das entregas.</h2></div><p>Do aplicativo à infraestrutura.<br>Minha base de trabalho e estudo.</p></div><div class=\"stackgrid\"><article class=\"stackgroup\"><div class=\"stacktitle\"><span>01</span><h3>Mobile</h3></div><p>Aplicativos e recursos nativos.</p><ul><li>React Native</li><li>Expo</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>02</span><h3>Front-end</h3></div><p>Interfaces e aplicações web.</p><ul><li>React</li><li>Next.js</li><li>HTML</li><li>CSS</li><li>SCSS</li><li>Tailwind CSS</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>03</span><h3>Back-end</h3></div><p>Serviços, APIs e integrações.</p><ul><li>Node.js</li><li>NestJS</li><li>Express.js</li><li>Fastify</li><li>Spring Boot</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>04</span><h3>Dados</h3></div><p>Persistência e acesso aos dados.</p><ul><li>Supabase</li><li>PostgreSQL</li><li>MySQL</li><li>MongoDB</li><li>NoSQL</li></ul><small>MongoDB consta na formação complementar; NoSQL é a categoria de bancos.</small></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>05</span><h3>Linguagens</h3></div><p>A base das minhas aplicações.</p><ul><li>JavaScript</li><li>TypeScript</li><li>Java</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>06</span><h3>Ferramentas e infraestrutura</h3></div><p>Versionamento, infraestrutura e entrega.</p><ul><li>Git</li><li>GitHub</li><li>AWS</li><li>CI/CD</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>07</span><h3>Qualidade e métodos</h3></div><p>Práticas que acompanham o desenvolvimento.</p><ul><li>Testes unitários</li><li>Testes E2E</li><li>Clean Code</li><li>Scrum</li><li>Kanban</li></ul></article><article class=\"stackgroup\"><div class=\"stacktitle\"><span>08</span><h3>Inteligência artificial</h3></div><p>Integrações e recursos em evolução.</p><ul><li>APIs de IA</li><li>Engenharia de prompts</li><li>LLM</li><li>RAG</li></ul><small>Chatbot com LLM e conceitos de RAG em desenvolvimento no Escoply.</small></article></div><p class=\"note\">Tecnologias e práticas do currículo, incluindo formação complementar. A lista não representa o mesmo nível de experiência em todos os itens.</p></section><section class=\"selected\"><div class=\"sectionhead\"><div><span class=\"eyebrow\">04 / TRABALHO EM FOCO</span><h2>O que estou construindo.</h2></div><button class=\"textlink\" onclick=\"parent.show('projetos')\">Ver seleção <svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#arrow-up-right\"/></svg></button></div><div class=\"featureproject\"><div class=\"featurecopy\"><span class=\"projectnumber\">01</span><span class=\"eyebrow\">PRODUTO AUTORAL</span><h3>Escoply<span>.</span></h3><p>Clientes, escopos, aprovações e prazos no mesmo lugar. Um SaaS pensado para a rotina de quem trabalha por conta própria.</p><div class=\"tags\"><span class=\"tag\">Web + mobile</span><span class=\"tag\">Em construção</span></div><button class=\"button\" onclick=\"parent.show('escoply')\">Conhecer o projeto <svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#arrow-right\"/></svg></button></div><div class=\"art escoply\"><div class=\"arttop\"><span>escoply</span><span>PRODUTO AUTORAL / EM CONSTRUÇÃO</span></div><div class=\" <figcaption>Igor Franco / por trás dos projetos</figcaption></figure></div></section><section class=\"introstrip\"><span class=\"eyebrow\">O FIO CONDUTOR</span><div><h2>Do freelance ao mobile.<br><em>E ao meu próprio produto.</em></h2><p>Atuo com desenvolvimento web freelance desde 2023, ano em que concluí Análise e Desenvolvimento de Sistemas na Unopar. Na Thux/Mathux, trabalhei em aplicações web, mobile e back-end, assumindo entregas mobile até o lançamento.</p><p>Hoje, meu percurso também passa pela Mágicos da Limpeza e pelo Escoply, uma plataforma autoral para gestão freelance em construção e em testes com usuários convidados.</p></div></section><section class=\"timeline\"><div class=\"sectionhead\"><span class=\"eyebrow\">PERCURSO / 2023 · 2026</span></div><div class=\"timelineitem\"><span class=\"eyebrow\">2023</span><div><h3>Formação e trabalho freelance</h3><p>Conclusão do tecnólogo em Análise e Desenvolvimento de Sistemas na Unopar. Desenvolvimento web freelance desde 2023.</p></div></div><div class=\"timelineitem\"><span class=\"eyebrow\">JUN 2025 · AGO 2026</span><div><h3>Thux / Mathux</h3><p>Produtos web e mobile, integrações, testes e lançamentos em produção.</p></div></div><div class=\"timelineitem\"><span class=\"eyebrow\">JAN 2026 · ATUAL</span><div><h3>Mágicos da Limpeza</h3><p>Desenvolvimento Full Stack em colaboração, conectando web, mobile e back-end.</p></div></div><div class=\"timelineitem\"><span class=\"eyebrow\">EM CONSTRUÇÃO</span><div><h3>Escoply</h3><p>SaaS autoral para freelancers. Testes com usuários convidados e evolução de recursos com IA.</p></div></div></section><section class=\"introstrip\"><span class=\"eyebrow\">FERRAMENTAS DE TRABALHO</span><div class=\"expertise\"><h3>Interfaces</h3><p>React, Next.js, TypeScript, HTML, CSS, SCSS e Tailwind CSS.</p><h3>Mobile</h3><p>React Native, Expo, recursos nativos e publicação nas lojas.</p><h3>Back-end e dados</h3><p>Node.js, NestJS, Express, Fastify, Supabase, PostgreSQL, MySQL e NoSQL. J
